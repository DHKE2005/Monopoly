<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 测试工具 - 大富翁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }
        .test-section {
            margin: 30px 0;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }
        .test-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        button {
            padding: 12px 30px;
            font-size: 1rem;
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin: 5px;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .input-group {
            margin: 15px 0;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 API 测试工具</h1>

        <!-- 基础连接测试 -->
        <div class="test-section">
            <h2>1️⃣ 基础连接测试</h2>
            <button onclick="testPing()">测试 API 连接</button>
            <button onclick="testDatabase()">测试数据库连接</button>
            <div id="pingResult" class="result" style="display: none;"></div>
        </div>

        <!-- 房间操作测试 -->
        <div class="test-section">
            <h2>2️⃣ 房间操作测试</h2>
            <div class="input-group">
                <label>玩家名称:</label>
                <input type="text" id="playerName" placeholder="输入玩家名" value="测试玩家">
            </div>
            <div class="input-group">
                <label>房间名称:</label>
                <input type="text" id="roomName" placeholder="输入房间名" value="测试房间">
            </div>
            <div class="input-group">
                <label>房间类型:</label>
                <select id="roomType" style="padding: 10px; border: 2px solid #ddd; border-radius: 8px;">
                    <option value="false">LAN 房间</option>
                    <option value="true">Railway 房间</option>
                </select>
            </div>
            <button onclick="testCreateRoom()">创建房间</button>
            <button onclick="testGetRooms()">获取房间列表</button>
            <div id="roomResult" class="result" style="display: none;"></div>
        </div>

        <!-- 环境信息 -->
        <div class="test-section">
            <h2>3️⃣ 环境信息</h2>
            <button onclick="showEnvironment()">显示环境信息</button>
            <div id="envResult" class="result" style="display: none;"></div>
        </div>
    </div>

    <script>
        const API_URL = 'api.php';

        function showResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.className = `result ${type}`;
            element.textContent = message;
            element.style.display = 'block';
        }

        async function testPing() {
            showResult('pingResult', '⏳ 正在测试 API 连接...', 'info');
            try {
                const response = await fetch(`${API_URL}?action=test`);
                const data = await response.json();
                showResult('pingResult', 
                    `✅ API 连接成功！\n\n` +
                    `服务器时间: ${data.server_time}\n` +
                    `PHP 版本: ${data.php_version}\n` +
                    `消息: ${data.message}`,
                    'success'
                );
            } catch (error) {
                showResult('pingResult', 
                    `❌ API 连接失败！\n\n` +
                    `错误: ${error.message}\n` +
                    `请检查:\n` +
                    `1. XAMPP Apache 是否已启动\n` +
                    `2. 文件路径是否正确\n` +
                    `3. 浏览器控制台是否有错误`,
                    'error'
                );
            }
        }

        async function testDatabase() {
            showResult('pingResult', '⏳ 正在测试数据库连接...', 'info');
            try {
                const response = await fetch(`${API_URL}?action=test_db`);
                const data = await response.json();
                
                if (data.success) {
                    showResult('pingResult', 
                        `✅ 数据库连接成功！\n\n` +
                        `数据库名: ${data.database}\n` +
                        `主机: ${data.host}\n` +
                        `消息: ${data.message}`,
                        'success'
                    );
                } else {
                    showResult('pingResult', 
                        `❌ 数据库连接失败！\n\n` +
                        `错误: ${data.error}\n\n` +
                        `请检查:\n` +
                        `1. XAMPP MySQL 是否已启动\n` +
                        `2. 数据库 monopoly_game 是否已创建\n` +
                        `3. 访问 setup_database.php 初始化数据库`,
                        'error'
                    );
                }
            } catch (error) {
                showResult('pingResult', 
                    `❌ 请求失败！\n\n` +
                    `错误: ${error.message}`,
                    'error'
                );
            }
        }

        async function testCreateRoom() {
            const playerName = document.getElementById('playerName').value.trim();
            const roomName = document.getElementById('roomName').value.trim();
            const isLan = document.getElementById('roomType').value === 'false';

            if (!playerName || !roomName) {
                showResult('roomResult', '❌ 请输入玩家名和房间名！', 'error');
                return;
            }

            showResult('roomResult', '⏳ 正在创建房间...', 'info');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'create_room',
                        room_name: roomName,
                        host_name: playerName,
                        max_players: 4,
                        is_lan: isLan
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showResult('roomResult', 
                        `✅ 房间创建成功！\n\n` +
                        `房间代码: ${data.room_code}\n` +
                        `房间名称: ${data.room_name}\n` +
                        `房间类型: ${isLan ? 'LAN 房间' : 'Railway 房间'}`,
                        'success'
                    );
                } else {
                    showResult('roomResult', 
                        `❌ 创建房间失败！\n\n` +
                        `错误: ${data.error}`,
                        'error'
                    );
                }
            } catch (error) {
                showResult('roomResult', 
                    `❌ 请求失败！\n\n` +
                    `错误: ${error.message}`,
                    'error'
                );
            }
        }

        async function testGetRooms() {
            const isLan = document.getElementById('roomType').value === 'false';
            showResult('roomResult', '⏳ 正在获取房间列表...', 'info');

            try {
                const response = await fetch(`${API_URL}?action=get_rooms&is_lan=${isLan}`);
                const data = await response.json();

                if (data.error) {
                    showResult('roomResult', 
                        `❌ 获取房间列表失败！\n\n` +
                        `错误: ${data.error}`,
                        'error'
                    );
                } else if (!data.rooms || data.rooms.length === 0) {
                    showResult('roomResult', 
                        `ℹ️ 暂无房间\n\n` +
                        `房间类型: ${isLan ? 'LAN 房间' : 'Railway 房间'}`,
                        'info'
                    );
                } else {
                    let roomList = data.rooms.map((room, i) => 
                        `房间 ${i + 1}:\n` +
                        `  代码: ${room.room_code}\n` +
                        `  名称: ${room.room_name}\n` +
                        `  房主: ${room.host_name}\n` +
                        `  人数: ${room.current_players}/${room.max_players}\n` +
                        `  状态: ${room.status}`
                    ).join('\n\n');

                    showResult('roomResult', 
                        `✅ 获取房间列表成功！\n\n` +
                        `共找到 ${data.rooms.length} 个房间:\n\n${roomList}`,
                        'success'
                    );
                }
            } catch (error) {
                showResult('roomResult', 
                    `❌ 请求失败！\n\n` +
                    `错误: ${error.message}`,
                    'error'
                );
            }
        }

        function showEnvironment() {
            const env = {
                'URL': window.location.href,
                'Protocol': window.location.protocol,
                'Host': window.location.host,
                'API Path': API_URL,
                'Browser': navigator.userAgent.split(' ').slice(-2).join(' ')
            };

            let envText = '🌐 当前环境信息:\n\n';
            for (let [key, value] of Object.entries(env)) {
                envText += `${key}: ${value}\n`;
            }

            showResult('envResult', envText, 'info');
        }

        // 页面加载时自动测试连接
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🎲 API 测试工具已加载');
        });
    </script>
</body>
</html>
