<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API连接测试 - 大富翁游戏</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border-color: #bee5eb;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 API连接测试</h1>
        
        <div class="test-section info">
            <h3>📋 环境信息</h3>
            <p><strong>当前URL:</strong> <span id="currentUrl"></span></p>
            <p><strong>API地址:</strong> <span id="apiUrl"></span></p>
            <p><strong>用户代理:</strong> <span id="userAgent"></span></p>
        </div>
        
        <div class="test-section">
            <h3>🧪 API测试</h3>
            <button onclick="testPing()">测试 Ping</button>
            <button onclick="testDatabase()">测试数据库</button>
            <button onclick="testCreateRoom()">测试创建房间</button>
            <button onclick="testGetRooms()">测试获取房间列表</button>
            <div id="testResults"></div>
        </div>
        
        <div class="test-section">
            <h3>📊 网络诊断</h3>
            <button onclick="runNetworkDiagnostics()">运行网络诊断</button>
            <div id="networkResults"></div>
        </div>
        
        <div style="text-align: center; margin-top: 30px;">
            <a href="index.html" style="display: inline-block; padding: 10px 20px; background: #28a745; color: white; text-decoration: none; border-radius: 5px;">🎮 返回游戏</a>
            <a href="diagnose.php" style="display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; margin-left: 10px;">🔧 服务器诊断</a>
        </div>
    </div>

    <script>
        // 动态设置API URL
        const API_URL = (() => {
            if (window.location.hostname.includes('railway') || window.location.hostname.includes('up.railway.app')) {
                return window.location.origin + '/api.php';
            }
            return 'api.php';
        })();

        // 显示环境信息
        document.getElementById('currentUrl').textContent = window.location.href;
        document.getElementById('apiUrl').textContent = API_URL;
        document.getElementById('userAgent').textContent = navigator.userAgent;

        async function testPing() {
            const results = document.getElementById('testResults');
            results.innerHTML = '<div class="status info">🔄 测试 Ping...</div>';
            
            try {
                const response = await fetch(`${API_URL}?action=ping`);
                const data = await response.json();
                
                if (data.success) {
                    results.innerHTML = `
                        <div class="status success">✅ Ping 成功</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    results.innerHTML = `
                        <div class="status error">❌ Ping 失败</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                results.innerHTML = `
                    <div class="status error">❌ 网络错误: ${error.message}</div>
                    <pre>API地址: ${API_URL}</pre>
                `;
            }
        }

        async function testDatabase() {
            const results = document.getElementById('testResults');
            results.innerHTML = '<div class="status info">🔄 测试数据库连接...</div>';
            
            try {
                const response = await fetch(`${API_URL}?action=test_db`);
                const data = await response.json();
                
                if (data.success) {
                    results.innerHTML = `
                        <div class="status success">✅ 数据库连接成功</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    results.innerHTML = `
                        <div class="status error">❌ 数据库连接失败</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                results.innerHTML = `
                    <div class="status error">❌ 网络错误: ${error.message}</div>
                `;
            }
        }

        async function testCreateRoom() {
            const results = document.getElementById('testResults');
            results.innerHTML = '<div class="status info">🔄 测试创建房间...</div>';
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'create_room',
                        room_name: '测试房间',
                        host_name: '测试房主',
                        max_players: 4,
                        is_lan: false
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    results.innerHTML = `
                        <div class="status success">✅ 创建房间成功</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    results.innerHTML = `
                        <div class="status error">❌ 创建房间失败</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                results.innerHTML = `
                    <div class="status error">❌ 网络错误: ${error.message}</div>
                `;
            }
        }

        async function testGetRooms() {
            const results = document.getElementById('testResults');
            results.innerHTML = '<div class="status info">🔄 测试获取房间列表...</div>';
            
            try {
                const response = await fetch(`${API_URL}?action=get_rooms&is_lan=false`);
                const data = await response.json();
                
                if (data.rooms) {
                    results.innerHTML = `
                        <div class="status success">✅ 获取房间列表成功</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    results.innerHTML = `
                        <div class="status error">❌ 获取房间列表失败</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                results.innerHTML = `
                    <div class="status error">❌ 网络错误: ${error.message}</div>
                `;
            }
        }

        async function runNetworkDiagnostics() {
            const results = document.getElementById('networkResults');
            results.innerHTML = '<div class="status info">🔄 运行网络诊断...</div>';
            
            let diagnostics = [];
            
            // 测试基本连接
            try {
                const startTime = Date.now();
                const response = await fetch(`${API_URL}?action=ping`);
                const endTime = Date.now();
                const responseTime = endTime - startTime;
                
                diagnostics.push(`✅ API响应时间: ${responseTime}ms`);
                
                if (response.ok) {
                    diagnostics.push('✅ HTTP状态码正常');
                } else {
                    diagnostics.push(`❌ HTTP状态码异常: ${response.status}`);
                }
            } catch (error) {
                diagnostics.push(`❌ 连接失败: ${error.message}`);
            }
            
            // 测试CORS
            try {
                const response = await fetch(API_URL, {
                    method: 'OPTIONS'
                });
                diagnostics.push('✅ CORS预检请求成功');
            } catch (error) {
                diagnostics.push(`❌ CORS预检失败: ${error.message}`);
            }
            
            // 测试POST请求
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'ping' })
                });
                diagnostics.push('✅ POST请求成功');
            } catch (error) {
                diagnostics.push(`❌ POST请求失败: ${error.message}`);
            }
            
            results.innerHTML = `
                <div class="status info">📊 网络诊断结果:</div>
                <pre>${diagnostics.join('\n')}</pre>
            `;
        }
    </script>
</body>
</html>
